[project]
name = "ideaseek-worker"
version = "0.1.0"
description = "IdeaSeek Python worker: page-aware PDF parsing behind a JSON subprocess protocol"
requires-python = ">=3.10"
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ideaseek_worker"]
